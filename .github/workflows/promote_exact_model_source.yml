name: Promote exact model source

on:
  push:
    paths:
      - '.release_staging/full_scale_experiment.ready'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble and verify authoritative model source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p code/model
          cat .release_staging/full_scale_experiment.b64.part* | base64 --decode > code/model/full_scale_experiment.py
          echo "83fc337128dec7f896c9816842806789a634154dea8372bb0a43bae19188d3bf  code/model/full_scale_experiment.py" | sha256sum -c -
          test "$(wc -c < code/model/full_scale_experiment.py)" -eq 66351

      - name: Commit verified byte-exact source and remove staging payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release_staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/model/full_scale_experiment.py .release_staging
          git commit -m "Promote exact checkpoint model source"
          git push
